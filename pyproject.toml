[project]
name = "prytan"
version = "0.1.0"
description = "A cloneable AI agent organization framework for Claude Code"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
org = "core.runtime.cli_main:main"
org-schedule = "core.scheduler.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
